# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: com.sap.lh.cs.zlhfieldmonitoring
type: application
framework:
  name: SAPUI5
  version: 1.120.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.suite.ui.generic.template
    - name: sap.ui.comp
    - name: sap.ui.generic.app
    - name: sap.ui.table
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        backend:
          - path: /sap
            url: http://sapsdvapp.aws.londonhydro.cloud:8000
            client: '200'
          - url: http://sapsdvapp.aws.londonhydro.cloud:8000/
            client: '200'
            path: /sap/opu/odata/sap/ZUI_OPERATION/
        ignoreCertErrors: false
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZWM_FIELD_COMP_WORK_SRV
            metadataPath: ./webapp/localService/metadata.xml
            mockdataPath: ./webapp/localService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZWM_SS_ORDER_OEB_SRV
            metadataPath: ./webapp/localService/OEBmainService/metadata.xml
            mockdataPath: ./webapp/localService/OEBmainService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZWM_ORDOPR_SCH_SRV
            metadataPath: ./webapp/localService/ORDOPRService/metadata.xml
            mockdataPath: ./webapp/localService/ORDOPRService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZUI_OPERATION
            metadataPath: ./webapp/localService/ZUI_OPERATION/metadata.xml
            mockdataPath: ./webapp/localService/ZUI_OPERATION/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/ZUI_OPERATION/ZUI_OPERATION_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZUI_OPERATION_VAN',Version='0001')/$value/
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: com.sap.lh.cs.zlhfieldmonitoring
        ui5Theme: sap_horizon
